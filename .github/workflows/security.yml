name: Security

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

env:
  DOCKERHUB_NAMESPACE: beeetfarmer

jobs:
  scans:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:latest detect \
            --source /repo \
            --no-git \
            --redact \
            --exit-code 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Frontend dependency audit
        working-directory: frontend
        run: |
          npm ci
          node scripts/audit-check.mjs

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Backend dependency audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r backend/requirements.txt

      - name: Semgrep
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            returntocorp/semgrep:latest semgrep scan \
            --config p/owasp-top-ten \
            --exclude-rule python.lang.security.audit.md5-used-as-password.md5-used-as-password \
            --exclude-rule python.lang.security.insecure-hash-algorithms-md5.insecure-hash-algorithm-md5

      - name: Checkov
        run: |
          python -m pip install checkov
          checkov -f docker-compose.yml -f docker-compose.dev.yml

      - name: Build backend image
        run: docker build --pull -t dropss-backend:${{ github.sha }} backend

      - name: Build frontend image
        run: docker build --pull -t dropss-frontend:${{ github.sha }} frontend

      - name: Trivy scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: dropss-backend:${{ github.sha }}
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: dropss-frontend:${{ github.sha }}
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: dropss-sbom.cdx.json
          # On tag builds the action otherwise tries to attach the SBOM as a
          # release asset, which needs contents:write and fails the job (and
          # skips the publish) under this job's contents:read. The SBOM is kept
          # as a workflow artifact below instead.
          upload-release-assets: false

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: dropss-sbom
          path: dropss-sbom.cdx.json

      # Publishing runs last, in this same job, so the images pushed are the
      # exact ones Trivy scanned above rather than a rebuild. Pull requests
      # still build and scan, but never publish.
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish images to Docker Hub
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        shell: bash
        run: |
          set -euo pipefail
          # sha- is always published and is the rollback target. A push to main
          # moves latest; a v* tag publishes the release version. Tagging is
          # what mints a version, so a version tag can never be overwritten by
          # an ordinary merge.
          tags=("sha-${GITHUB_SHA:0:7}")
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            tags+=("latest")
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tags+=("${GITHUB_REF#refs/tags/v}")
          fi

          for svc in backend frontend; do
            built="dropss-${svc}:${GITHUB_SHA}"
            repo="${DOCKERHUB_NAMESPACE}/dropss-${svc}"
            for tag in "${tags[@]}"; do
              docker tag "$built" "${repo}:${tag}"
              docker push "${repo}:${tag}"
              echo "published ${repo}:${tag}"
            done
          done
