name: Security

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  scans:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Frontend dependency audit
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=moderate

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Backend dependency audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r backend/requirements.txt

      - name: Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/owasp-top-ten

      - name: Checkov
        run: |
          python -m pip install checkov
          checkov -f docker-compose.yml -f docker-compose.dev.yml

      - name: Build backend image
        run: docker build -t dropss-backend:${{ github.sha }} backend

      - name: Build frontend image
        run: docker build -t dropss-frontend:${{ github.sha }} frontend

      - name: Trivy scan backend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: dropss-backend:${{ github.sha }}
          vuln-type: os,library
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Trivy scan frontend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: dropss-frontend:${{ github.sha }}
          vuln-type: os,library
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: dropss-sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: dropss-sbom
          path: dropss-sbom.cdx.json
